server {
    root /opt/open_mower_ros/web;
    listen       8080;

    location ~* \.wasm$ {
        default_type application/wasm;
    }

    # Keep the Flutter entrypoint assets fresh so browsers do not get stuck on
    # a stale bundle after Pi-side deploys.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location ~* ^/(flutter_bootstrap\.js|main\.dart\.js|flutter_service_worker\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
