# Keep generated web output and third-party/submodule sources out of broad
# formatting. Authoritative first-party configuration, including
# config/mower_config.schema.json, must still be validated.
exclude: '^(?:web/|src/lib/|src/mower_logic/third_party/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]
        exclude: '^(?:config/mower_config.schema.json|webui/package-lock.json)$'
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-new-submodules
      - id: mixed-line-ending
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.0
    hooks:
      - id: clang-format
        args: [--style=file,-i]
  - repo: local
    hooks:
      - id: validate-commit-message
        name: validate Conventional Commit message and evidence body
        entry: python3 scripts/agent/validate_commit_message.py
        language: system
        stages: [commit-msg]
