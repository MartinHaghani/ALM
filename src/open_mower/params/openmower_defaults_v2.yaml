ll:
  bind_ip: "172.16.78.1"

  services:
    sound:
      language: "en"
      volume: -1
    gps:
      baud_rate: 921600
      protocol: "UBX"
      datum_height: 0
      absolute_coords: true
    imu:
      axis_config: "+X-Y-Z"
    power:
      battery_critical_high_voltage: -1
      charge_critical_high_voltage: -1
      charge_critical_high_current: -1

xbot_positioning:
  max_gps_accuracy: 0.2
  debug: false

ntrip_client:
  reconnect_attempt_max: 5
  reconnect_attempt_wait_seconds: 99999

mower_logic:
  automatic_mode: 0
  docking_approach_distance: 1.5
  docking_extra_time: 0
  docking_retry_count: 4
  docking_redock: false
  outline_overlap_count: 0
  mow_angle_offset: 0
  mow_angle_offset_is_absolute: false
  mow_angle_increment: 0
  gps_wait_time: 10.0
  gps_timeout: 10.0
  rain_mode: 0
  rain_delay_minutes: 30
  rain_check_seconds: 20
  cu_rain_threshold: -1
  undock_angled_distance: 0.0
  undock_angle: 0.0
  undock_fixed_angle: true
  undock_use_curve: true
  emergency_lift_period: -1
  emergency_tilt_period: -1
  ignore_charging_current: false

xbot_monitoring:
  external_mqtt_enable: false

terrain_observer:
  update_rate_hz: 10.0
  terrain_memory_file: "terrain_memory.json"
  terrain_memory_cell_size: 0.5
  terrain_memory_lookahead_poses: 20
  terrain_memory_caution_threshold: 0.35
  terrain_memory_exclusion_threshold: 0.80
  terrain_memory_exclusion_buffer: 0.10
  terrain_memory_max_exclusion_cells: 200
  terrain_memory_save_seconds: 5.0
  memory_learning_min_speed: 0.05
  slip_lat_error_weight: 0.70
  slip_error_rate_weight: 0.45
  slip_speed_error_weight: 0.35
  slip_cross_slope_weight: 0.25
  compensation_slip_threshold: 0.28
  recovery_slip_threshold: 0.58
  hold_slip_threshold: 0.82
  compensation_cross_slope_deg: 4.0
  speed_scale_min: 0.35
  recovery_speed_scale: 0.0
  speed_scale_downhill_per_deg: 0.025
  speed_scale_cross_per_deg: 0.05
  uphill_speed_bonus_per_deg: 0.010
  speed_scale_max_uphill: 1.10
  heading_bias_gain: 0.04
  heading_bias_max_rad: 0.20
