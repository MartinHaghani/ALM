# Shared default footprint now matches the measured Mowrator rectangle in meters.
footprint: [[0.0, 0.34], [0.82, 0.34], [0.82, -0.34], [0.0, -0.34]]

global_frame: map
robot_base_frame: base_link

plugins:
- name: static_layer
  type: costmap_2d::StaticLayer
- name: obstacle_layer
  type: costmap_2d::ObstacleLayer
- name: inflation_layer
  type: costmap_2d::InflationLayer

static_layer:
  map_topic: mower_map_service/map
obstacle_layer:
  max_obstacle_height: 1.0
  obstacle_range: 3.0
  raytrace_range: 4.0
